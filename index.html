<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC — Cosmology & Scaling</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c0e;
      --surface: #121418;
      --surface-hover: #181b20;
      --border: #232730;
      --text-primary: #eceef2;
      --text-secondary: #9aa1ae;
      --text-muted: #626976;
      --accent: #e2e5ec;
      --accent-subtle: rgba(226, 229, 236, 0.08);
      --yt-accent: #d9383a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Header & Top Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 12, 14, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--text-primary);
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      border: 1.5px solid var(--text-primary);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .brand-title {
      font-weight: 600;
      letter-spacing: 0.14em;
      font-size: 1rem;
    }

    /* Section Switcher */
    .switcher {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }

    .switch-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: 'Inter', sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 0.45rem 1.15rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .switch-btn:hover {
      color: var(--text-primary);
    }

    .switch-btn.active {
      background: var(--accent);
      color: #0b0c0e;
      font-weight: 600;
    }

    /* External Links (YouTube + GitHub) */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .ext-link {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      text-decoration: none;
      font-size: 0.825rem;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 7px;
      transition: all 0.2s ease;
    }

    .ext-link:hover {
      border-color: var(--text-secondary);
      color: var(--text-primary);
      background: var(--surface-hover);
    }

    .ext-link.yt:hover {
      border-color: var(--yt-accent);
      color: #fff;
    }

    /* Main Container */
    main {
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 1.5rem 5rem;
      flex: 1;
    }

    .hero {
      border-bottom: 1px solid var(--border);
      padding-bottom: 2.25rem;
      margin-bottom: 2.5rem;
    }

    .hero-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      display: block;
    }

    .hero h1 {
      font-size: clamp(1.85rem, 3.5vw, 2.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .hero p {
      color: var(--text-secondary);
      max-width: 740px;
      font-size: 1.02rem;
    }

    /* Tab Views */
    .view-section {
      display: none;
      animation: fadeIn 0.22s ease;
    }

    .view-section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Grids */
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .repo-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      text-decoration: none;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 2px;
    }

    .repo-badge:hover {
      color: var(--text-primary);
      border-color: var(--text-primary);
    }

    .callout {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 1.35rem 1.5rem;
      margin-bottom: 2rem;
      color: var(--text-secondary);
      font-size: 0.96rem;
    }

    .callout strong {
      color: var(--text-primary);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.15rem;
      margin-bottom: 2.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.4rem;
      transition: border-color 0.2s ease;
    }

    .card:hover {
      border-color: #383e4c;
    }

    .card-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 0.45rem;
      display: block;
    }

    .card h3 {
      font-size: 1.08rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      color: var(--text-primary);
    }

    .card p, .card li {
      font-size: 0.93rem;
      color: var(--text-secondary);
    }

    .card ul {
      list-style: none;
      margin-top: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }

    .card li::before {
      content: "— ";
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Scale Table */
    .scale-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    .scale-head {
      padding: 1.1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.015);
    }

    .scale-row {
      display: grid;
      grid-template-columns: 210px 1fr;
      padding: 1rem 1.4rem;
      border-bottom: 1px solid var(--border);
      gap: 1rem;
      align-items: baseline;
    }

    .scale-row:last-child {
      border-bottom: none;
    }

    .scale-rank {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .scale-desc {
      font-size: 0.94rem;
      color: var(--text-secondary);
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 1.5rem;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--text-primary);
    }

    @media (max-width: 640px) {
      .scale-row {
        grid-template-columns: 1fr;
        gap: 0.35rem;
      }
      .nav-container {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="brand" onclick="switchTab('cosmology'); return false;">
        <span class="brand-mark">TCC</span>
        <span class="brand-title">TCC</span>
      </a>

      <!-- Switcher for 2 Sections -->
      <div class="switcher" role="tablist" aria-label="TCC Sections">
        <button class="switch-btn active" id="btn-cosmology" onclick="switchTab('cosmology')">Cosmology</button>
        <button class="switch-btn" id="btn-scaling" onclick="switchTab('scaling')">Scaling</button>
      </div>

      <!-- YouTube & GitHub Links -->
      <div class="nav-links">
        <a class="ext-link yt" href="https://youtube.com" target="_blank" rel="noopener">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
          YouTube
        </a>
        <a class="ext-link" href="https://github.com" target="_blank" rel="noopener">
          GitHub
        </a>
      </div>
    </div>
  </header>
