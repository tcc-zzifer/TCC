<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCC // MANN CO. — Source & TF2 Analytical Standard</title>
<link rel="icon" type="image/png" href="./favicon.png">
<style>
@font-face{font-family:'TF2Build';src:url('./fonts/tf2build.ttf') format('truetype'),local('TF2 Build'),local('Impact');font-display:swap}
@font-face{font-family:'TF2Secondary';src:url('./fonts/tf2secondary.ttf') format('truetype'),local('TF2 Secondary'),local('Trebuchet MS');font-display:swap}
:root{--bg:#0b0c0e;--panel:#121419;--panel-alt:#181b22;--border:#272c38;--text:#d8dee9;--muted:#8a94a6;--orange:#e07a2c;--amber:#f59e0b;--cyan:#38bdf8;--white:#f8fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;line-height:1.7}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--orange),var(--orange) 14px,#15171c 14px,#15171c 28px)}
header{border-bottom:2px solid var(--border);background:radial-gradient(circle at top,#1b1f29 0%,var(--bg) 78%);padding:36px 20px 28px;text-align:center}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.badge{font-family:'TF2Secondary',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 12px;border-radius:4px}
.b-org{color:var(--amber);background:rgba(224,122,44,.14);border:1px solid rgba(224,122,44,.5)}
.b-cyn{color:var(--cyan);background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.4)}
.logo{font-family:'TF2Build','Impact',sans-serif;font-size:clamp(40px,8vw,74px);letter-spacing:3px;line-height:1.05;margin-bottom:6px}
.sub{font-family:'TF2Secondary',sans-serif;font-size:clamp(15px,2.4vw,21px);color:var(--amber);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
.desc{color:var(--muted);max-width:740px;margin:0 auto 22px;font-size:14px}
.nav-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:960px;margin:0 auto}
.btn{font-family:'TF2Build','Impact',sans-serif;background:var(--panel-alt);color:var(--muted);border:2px solid var(--border);padding:12px 24px;border-radius:6px;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;cursor:pointer;transition:.15s}
.btn.active,.btn:hover{border-color:var(--orange);background:rgba(224,122,44,.18);color:var(--amber)}
.wrap{display:grid;grid-template-columns:280px 1fr;gap:24px;max-width:1320px;margin:26px auto;padding:0 20px 70px}
aside{position:sticky;top:16px;height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--orange);border-radius:8px;padding:16px}
aside h3{font-family:'TF2Secondary',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:1.4px;color:var(--amber);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
aside a{font-family:'TF2Secondary',sans-serif;display:block;color:var(--text);text-decoration:none;font-size:14px;padding:7px 9px;border-radius:4px;margin-bottom:4px;border-left:3px solid transparent;cursor:pointer}
aside a:hover,aside a.act{background:rgba(224,122,44,.14);border-left-color:var(--orange);color:var(--white)}
main{background:var(--panel);border:1px solid var(--border);border-top:4px solid var(--cyan);border-radius:8px;padding:clamp(20px,4vw,40px)}
main h1{font-family:'TF2Build','Impact',sans-serif;color:var(--white);font-size:23px;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:10px;margin:34px 0 14px}
main h1:first-child{margin-top:0}
main h2{font-family:'TF2Secondary',sans-serif;color:var(--amber);font-size:19px;margin:22px 0 10px}
main h3{font-family:'TF2Secondary',sans-serif;color:var(--cyan);font-size:16px;margin:16px 0 6px}
main p{margin-bottom:12px}
main ul{margin:0 0 14px 22px}
main li{margin-bottom:7px}
main strong{color:var(--white)}
main em{color:#93c5fd}
@media(max-width:900px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;max-height:240px}}
</style>
</head>
<body>
<div class="hazard"></div>
<header>
  <div class="badges">
    <span class="badge b-org">Source &amp; TF2 Community Analytical Standard</span>
    <span class="badge b-cyn">Author: ZZIFER • Pure Logic Rules Here</span>
  </div>
  <div class="logo"><span style="color:#f8fafc">TCC</span> <span style="color:#38bdf8">//</span> <span style="color:#e07a2c">MANN CO.</span></div>
  <p class="desc">Independent Tactical Combat &amp; Scaling Standard for the Source / TF2 Community — and the Unified Ring Nexus connecting TF2 Fan-Verses with High-Scale Cosmology.</p>
  <div class="nav-row">
    <button class="btn active" id="btn-core" onclick="loadCore()">01 // Core Protocols</button>
    <button class="btn" id="btn-chars" onclick="loadChars()">02 // Source Character Roster</button>
    <button class="btn" id="btn-world" onclick="loadWorld()">03 // TCC: The Source Cosmology</button>
  </div>
</header>
<div class="wrap">
  <aside>
    <h3 id="nav-title">// Terminal Navigation</h3>
    <div id="nav-list"></div>
  </aside>
  <main id="viewer"></main>
</div>
<script>
const viewer = document.getElementById('viewer');
const navList = document.getElementById('nav-list');
const navTitle = document.getElementById('nav-title');
const CHAR_FILES = ['saxton-hale.md'];
function setActiveTab(activeId) {
  ['btn-core', 'btn-chars', 'btn-world'].forEach(id => {
    document.getElementById(id).classList.toggle('active', id === activeId);
  });
}
function parseMd(text) {
  const lines = text.split(/\r?\n/);
  let html = '', inList = false;
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g,'<em>$1</em>');
  for (let raw of lines) {
    const l = raw.trim();
    if (!l) { if (inList) { html += '</ul>'; inList = false; } continue; }
    if (l.startsWith('# ')) { if (inList) { html += '</ul>'; inList = false; } html += '<h1>' + esc(l.slice(2)) + '</h1>'; }
    else if (l.startsWith('## ')) { if (inList) { html += '</ul>'; inList = false; } html += '<h2>' + esc(l.slice(3)) + '</h2>'; }
    else if (l.startsWith('### ')) { if (inList) { html += '</ul>'; inList = false; } html += '<h3>' + esc(l.slice(4)) + '</h3>'; }
    else if (l.startsWith('- ') || l.startsWith('* ') || l.startsWith('• ')) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + esc(l.slice(2)) + '</li>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<p>' + esc(l) + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html;
}
async function loadCore() {
  setActiveTab('btn-core');
  navTitle.textContent = '// Protocol Index';
  viewer.innerHTML = '<p style="color:#f59e0b">Loading dossiers/part-01-core-and-mechanics.md...</p>';
  try {
    const res = await fetch('./dossiers/part-01-core-and-mechanics.md?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    viewer.innerHTML = parseMd(text);
    navList.innerHTML = '';
    viewer.querySelectorAll('h1').forEach((h, i) => {
      h.id = 'sec-' + i;
      const a = document.createElement('a');
      a.href = '#sec-' + i;
      a.textContent = h.textContent.replace('TCC Standard Dossier: ', '').replace('TCC Standard Protocol: ', '');
      navList.appendChild(a);
    });
  } catch (e) {
    viewer.innerHTML = '<p style="color:#f87171">Error loading core dossier.</p>';
  }
}
async function openChar(name, link) {
  navList.querySelectorAll('a').forEach(a => a.classList.remove('act'));
  if (link) link.classList.add('act');
  viewer.innerHTML = '<p style="color:#f59e0b">Loading ' + name + '...</p>';
  try {
    const res = await fetch('./characters/' + name + '?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    viewer.innerHTML = parseMd(text);
  } catch (e) {
    viewer.innerHTML = '<p style="color:#f87171">Error loading ' + name + '</p>';
  }
}
function loadChars() {
  setActiveTab('btn-chars');
  navTitle.textContent = '// Characters Roster';
  navList.innerHTML = '';
  CHAR_FILES.forEach((file, idx) => {
    const a = document.createElement('a');
    a.textContent = '// ' + file.replace('.md', '').replace(/-/g, ' ').toUpperCase();
    a.onclick = () => openChar(file, a);
    navList.appendChild(a);
    if (idx === 0) openChar(file, a);
  });
}
async function loadWorld() {
  setActiveTab('btn-world');
  navTitle.textContent = '// Source Cosmology';
  viewer.innerHTML = '<p style="color:#f59e0b">Loading TCC: The Source Cosmology...</p>';
  try {
    const fileName = encodeURIComponent('TCC: The Source Cosmology');
    const res = await fetch('./world/' + fileName + '?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    const text = await res.text();
    viewer.innerHTML = parseMd(text);
    navList.innerHTML = '';
    viewer.querySelectorAll('h1, h2').forEach((h, i) => {
      h.id = 'world-' + i;
      const a = document.createElement('a');
      a.href = '#world-' + i;
      a.textContent = h.textContent;
      navList.appendChild(a);
    });
  } catch (e) {
    viewer.innerHTML = '<p style="color:#f87171">Error loading world/TCC: The Source Cosmology.</p>';
  }
}
loadCore();
</script>
</body>
</html>
