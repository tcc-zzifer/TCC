<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TCC™ — The Circular Canon</title>
  <style>
    :root {
      --bg: #050505;
      --surface: #0b0d0d;
      --border: #1e2222;
      --text: #ededed;
      --muted: #828c8c;
      --cyan: #2de2e6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.7;
      min-height: 100vh;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 680px; height: 680px;
      transform: translate(-50%, -50%);
      border: 34px solid rgba(255, 255, 255, 0.02);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(5, 5, 5, 0.94);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      max-width: 980px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo {
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.04em;
      color: var(--text);
      text-decoration: none;
      line-height: 1;
    }
    .logo span {
      font-family: monospace;
      font-size: 0.72rem;
      color: var(--cyan);
      vertical-align: super;
      margin-left: 2px;
    }
    .tabs {
      display: flex;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .tab {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      padding: 9px 22px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .tab:first-child { border-right: 1px solid var(--border); }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--text); color: #050505; }
    .yt {
      border: 1px solid var(--cyan);
      color: var(--cyan);
      text-decoration: none;
      font-family: Impact, 'Arial Narrow', sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      text-transform: uppercase;
    }
    .yt:hover { background: var(--cyan); color: #050505; }
    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      position: relative;
      z-index: 1;
    }
    .status {
      font-size: 0.8rem;
      color: var(--cyan);
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .content h1, .content h2, .content h3 {
      font-family: Impact, 'Arial Narrow', sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin: 1.5em 0 0.5em;
      line-height: 1.1;
      color: var(--text);
    }
    .content h1 { font-size: 2.5rem; border-left: 4px solid var(--cyan); padding-left: 14px; margin-top: 0; }
    .content h2 { font-size: 1.7rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .content h3 { font-size: 1.25rem; color: var(--cyan); }
    .content p { margin-bottom: 1em; color: #cfd6d6; font-size: 0.94rem; }
    .content ul { margin: 0 0 1.2em 1.4em; color: #cfd6d6; font-size: 0.94rem; }
    .content li { margin-bottom: 0.45em; }
    .content strong { color: #fff; }
    .content blockquote {
      background: var(--surface);
      border-left: 3px solid var(--cyan);
      padding: 14px 18px;
      margin: 1.2em 0;
      color: var(--muted);
    }
    .content hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
  </style>
</head>
<body>

  <header>
    <div class="nav">
      <a href="#cosmology" class="logo" onclick="loadFile('cosmology/tcccosmology.md', 'btn-cosmology'); return false;">TCC<span>TM</span></a>
      <div class="tabs">
        <button class="tab active" id="btn-cosmology" onclick="loadFile('cosmology/tcccosmology.md', 'btn-cosmology')">Cosmology</button>
        <button class="tab" id="btn-scaling" onclick="loadFile('scaling/tcc.md', 'btn-scaling')">Scaling</button>
      </div>
      <a class="yt" href="https://www.youtube.com/@THECIRCULARCANON" target="_blank" rel="noopener">YouTube</a>
    </div>
  </header>

  <main>
    <div class="status" id="status">Loading...</div>
    <article class="content" id="viewer"></article>
  </main>

  <script>
        function renderMd(md) {
      let html = md
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^\s*#### (.*$)/gim, '<h4>$1</h4>')
        .replace(/^\s*### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^\s*## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^\s*# (.*$)/gim, '<h1>$1</h1>')
        .replace(/^\s*&gt; (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/^\s*---$/gim, '<hr>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/^\s*[\*\-] (.*$)/gim, '<ul><li>$1</li></ul>')
        .replace(/<\/ul>\s*<ul>/g, '');
      return html.split(/\n{2,}/).map(block => {
        block = block.trim();
        if (!block) return '';
        if (/^<(h1|h2|h3|h4|blockquote|hr|ul)/.test(block)) return block;
        return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
      }).join('\n');
    }

    async function loadFile(url, btnId) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');

      const status = document.getElementById('status');
      const viewer = document.getElementById('viewer');
      status.textContent = `// LOADING: ${url}`;
      viewer.innerHTML = '';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = (await res.text()).trim();

        status.textContent = `// ARCHIVE: ${url}`;
        viewer.innerHTML = text ? renderMd(text) : '<p style="color: var(--muted);">// EMPTY FILE</p>';
      } catch (e) {
        status.textContent = `// ERROR: ${e.message}`;
        viewer.innerHTML = `<p>Failed to load: ${url}</p>`;
      }
    }

    loadFile('cosmology/tcccosmology.md', 'btn-cosmology');
  </script>
</body>
</html>
